runtime:
  rag:
    provider: bedrock
    model: us.amazon.nova-2-lite-v1:0
  chat:
    provider: bedrock
    model: us.anthropic.claude-sonnet-4-6
  openai:
    base_url: https://api.openai.com/v1
  input_guardrail_orchestration:
    enabled: true
    warning_threshold: 1
    end_chat_threshold: 2
    session_termination_enabled: true
    penalty:
      enabled: true
      amount: 5
  teaching_plan_orchestration:
    enabled: false
    homework_assist_only: true
    require_published_plan: true
    require_open_week: true
  references_orchestration:
    enabled: false
    homework_assist_only: true
    retrieval_enabled: false
  aurora_retry:
    interactive:
      connect_timeout_seconds: 3
      max_attempts: 5
      retry_sleep_seconds: 1.0
    reliable:
      connect_timeout_seconds: 3
      max_attempts: 8
      retry_sleep_seconds: 1.0
  chat_log_export:
    bucket: codingrabbit-data-dev
    connect_timeout_seconds: 3
    prefix: eval/chat_logs/turn_logs
